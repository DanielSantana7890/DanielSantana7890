<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-labelledby="footer-title footer-description">
  <title id="footer-title">Daniel Santana — rodapé</title>
  <desc id="footer-description">Rodapé em estilo terminal de Daniel Santana, com o usuário daniel@github e a mensagem: obrigado pela visita! volte sempre :).</desc>

  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:17px;white-space:pre}
    .process-status{font-size:13px}
    .cur{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .cur{animation:none}
    }
  </style>

  <rect x="1" y="1" width="998" height="118" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="30" y="48" xml:space="preserve"><tspan fill="#39d353">daniel@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan x="203.4" fill="#c9d1d9">exit</tspan></text>
  <text x="30" y="82" xml:space="preserve"><tspan fill="#8b949e">&gt; </tspan><tspan fill="#39d353">obrigado pela visita!</tspan><tspan fill="#8b949e">  volte sempre :)</tspan></text>
  <rect x="441" y="67" width="10" height="19" fill="#c9d1d9" class="cur" aria-hidden="true"/>
  <text x="970" y="82" text-anchor="end" fill="#8b949e" class="process-status">[processo finalizado com código 0]</text>
</svg>
