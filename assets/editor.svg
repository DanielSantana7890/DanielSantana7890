<svg xmlns="http://www.w3.org/2000/svg" width="570" height="360" viewBox="0 0 570 360" role="img" aria-labelledby="editor-title editor-description">
  <title id="editor-title">Daniel Santana — perfil em Python</title>
  <desc id="editor-description">Editor animado com o perfil de Daniel Santana, daniel@github. Full-Stack, Inteligência Artificial e Motion. Campo Grande MS, Brasil. Pronto para novos desafios. As linhas se repetem a cada 12 segundos.</desc>

  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:14px}
    .window-title,.status-text{font-size:12px}
    .tab-label,.line-number{font-size:13px}
    .ln{opacity:0;animation-duration:12s;animation-timing-function:ease-out;animation-iteration-count:infinite}
    /* As linhas reaparecem a cada 12s, com pausa para leitura. */
    @keyframes line-030{0%,2.5%{opacity:0;transform:translateX(-5px)}5.416667%,100%{opacity:1;transform:none}}
    @keyframes line-055{0%,4.583333%{opacity:0;transform:translateX(-5px)}7.5%,100%{opacity:1;transform:none}}
    @keyframes line-080{0%,6.666667%{opacity:0;transform:translateX(-5px)}9.583333%,100%{opacity:1;transform:none}}
    @keyframes line-105{0%,8.75%{opacity:0;transform:translateX(-5px)}11.666667%,100%{opacity:1;transform:none}}
    @keyframes line-130{0%,10.833333%{opacity:0;transform:translateX(-5px)}13.75%,100%{opacity:1;transform:none}}
    @keyframes line-155{0%,12.916667%{opacity:0;transform:translateX(-5px)}15.833333%,100%{opacity:1;transform:none}}
    @keyframes line-180{0%,15%{opacity:0;transform:translateX(-5px)}17.916667%,100%{opacity:1;transform:none}}
    @keyframes line-205{0%,17.083333%{opacity:0;transform:translateX(-5px)}20%,100%{opacity:1;transform:none}}
    @keyframes line-230{0%,19.166667%{opacity:0;transform:translateX(-5px)}22.083333%,100%{opacity:1;transform:none}}
    @keyframes line-255{0%,21.25%{opacity:0;transform:translateX(-5px)}24.166667%,100%{opacity:1;transform:none}}
  </style>

