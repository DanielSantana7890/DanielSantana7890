  <text x="840.5" y="240" text-anchor="middle" fill="#8b949e" class="caption">// full-stack · ia · motion</text>

  <text x="30" y="96" class="o" style="animation-delay:0.50s"><tspan fill="#39d353">daniel@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan x="203.4" fill="#c9d1d9">whoami</tspan></text>
  <rect x="203.4" y="80" width="65" height="22" fill="#0d1117" class="tp" style="--w:65px;animation:tp 0.36s steps(6) 0.80s forwards"/>
  <text x="30" y="124" class="o" style="animation-delay:1.51s"><tspan fill="#c9d1d9" font-size="26" font-weight="700">Daniel Santana</tspan></text>

  <text x="30" y="158" class="o" style="animation-delay:1.76s"><tspan fill="#39d353">daniel@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan x="203.4" fill="#c9d1d9">cat foco.txt</tspan></text>
  <rect x="203.4" y="142" width="126" height="22" fill="#0d1117" class="tp" style="--w:126px;animation:tp 0.72s steps(12) 2.06s forwards"/>
  <text x="30" y="186" class="o" style="animation-delay:3.13s"><tspan fill="#d2a8ff">Full-Stack</tspan><tspan fill="#8b949e">  &amp;&amp;  </tspan><tspan fill="#ffa657">Inteligência Artificial</tspan><tspan fill="#8b949e">  &amp;&amp;  </tspan><tspan fill="#79c0ff">Motion</tspan></text>

  <text x="30" y="214" class="o" style="animation-delay:3.38s"><tspan fill="#39d353">daniel@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan x="203.4" fill="#c9d1d9">echo $LOCALIZACAO</tspan></text>
  <rect x="203.4" y="198" width="177" height="22" fill="#0d1117" class="tp" style="--w:177px;animation:tp 1.02s steps(17) 3.68s forwards"/>
  <text x="30" y="242" class="o" style="animation-delay:5.05s"><tspan fill="#a5d6ff">Campo Grande MS, Brasil</tspan></text>

  <text x="30" y="270" class="o" style="animation-delay:5.30s"><tspan fill="#39d353">daniel@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan x="203.4" fill="#c9d1d9">./carregar_carreira.sh</tspan></text>
  <rect x="203.4" y="254" width="228" height="22" fill="#0d1117" class="tp" style="--w:228px;animation:tp 1.32s steps(22) 5.60s forwards"/>
  <text x="30" y="298" class="o" style="animation-delay:7.27s"><tspan fill="#8b949e">[</tspan></text>
  <rect x="44" y="285" width="300" height="14" rx="2" fill="#161b22" class="o" style="animation-delay:7.27s"/>
  <rect x="44" y="285" width="300" height="14" rx="2" fill="#39d353" class="bar" style="animation:bar 2.4s steps(20) 7.27s forwards"/>
  <text x="350" y="298" class="o" style="animation-delay:7.27s"><tspan fill="#8b949e">]</tspan></text>
  <text x="370" y="298" class="o" style="animation-delay:9.77s"><tspan fill="#39d353">✔ pronto para novos desafios</tspan></text>

  <text x="30" y="328" class="o" style="animation-delay:9.97s"><tspan fill="#39d353">daniel@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan></text>
  <rect x="203.4" y="313" width="10" height="19" fill="#c9d1d9" class="cur" style="animation-delay:9.97s"/>
