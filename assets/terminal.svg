    <rect x="822" y="177" width="11" height="11" rx="2"/>
    <rect x="770" y="190" width="11" height="11" rx="2"/>
    <rect x="783" y="190" width="11" height="11" rx="2"/>
    <rect x="796" y="190" width="11" height="11" rx="2"/>
    <rect x="809" y="190" width="11" height="11" rx="2"/>

    <!-- S -->
    <rect x="861" y="112" width="11" height="11" rx="2"/>
    <rect x="874" y="112" width="11" height="11" rx="2"/>
    <rect x="887" y="112" width="11" height="11" rx="2"/>
    <rect x="900" y="112" width="11" height="11" rx="2"/>
    <rect x="848" y="125" width="11" height="11" rx="2"/>
    <rect x="848" y="138" width="11" height="11" rx="2"/>
    <rect x="861" y="151" width="11" height="11" rx="2"/>
    <rect x="874" y="151" width="11" height="11" rx="2"/>
    <rect x="887" y="151" width="11" height="11" rx="2"/>
    <rect x="900" y="164" width="11" height="11" rx="2"/>
    <rect x="900" y="177" width="11" height="11" rx="2"/>
    <rect x="848" y="190" width="11" height="11" rx="2"/>
    <rect x="861" y="190" width="11" height="11" rx="2"/>
    <rect x="874" y="190" width="11" height="11" rx="2"/>
    <rect x="887" y="190" width="11" height="11" rx="2"/>
