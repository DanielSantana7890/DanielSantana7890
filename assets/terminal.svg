<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="terminal-title terminal-description">
  <title id="terminal-title">Daniel Santana — Full-Stack, Inteligência Artificial e Motion</title>
  <desc id="terminal-description">Terminal animado de daniel@github. Daniel Santana, de Campo Grande MS, Brasil. Após o carregamento: pronto para novos desafios. Iniciais DS em azul à direita.</desc>

  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:17px;white-space:pre}
    .window-title{font-size:14px}
    .caption{font-size:13px}
    .o{opacity:0;animation:o .01s linear forwards}
    @keyframes o{to{opacity:1}}
    @keyframes tp{to{transform:translateX(var(--w));width:0}}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0)}
    @keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .cur{opacity:0;animation:o .01s linear forwards,bl 1s steps(1) infinite}
    @keyframes bl{50%{fill:transparent}}
    .glow2{animation:gl 3s ease-in-out infinite}
    @keyframes gl{50%{opacity:.6}}
  </style>

  <defs>
    <linearGradient id="mg" gradientUnits="userSpaceOnUse" x1="770" y1="112" x2="911" y2="201">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <filter id="gw" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="368" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 15 a14 14 0 0 1 14 -14 H985 a14 14 0 0 1 14 14 V46 H1Z" fill="#161b22"/>
  <rect x="1" y="46" width="998" height="1" fill="#30363d"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="24" r="7" fill="#febc2e"/>
  <circle cx="72" cy="24" r="7" fill="#28c840"/>
  <text x="500" y="29" text-anchor="middle" fill="#8b949e" class="window-title">daniel@github: ~ — bash</text>

  <g class="glow2" filter="url(#gw)" fill="url(#mg)" aria-hidden="true">
    <!-- D -->
    <rect x="770" y="112" width="11" height="11" rx="2"/>
    <rect x="783" y="112" width="11" height="11" rx="2"/>
    <rect x="796" y="112" width="11" height="11" rx="2"/>
    <rect x="809" y="112" width="11" height="11" rx="2"/>
    <rect x="770" y="125" width="11" height="11" rx="2"/>
